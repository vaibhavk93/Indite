# What indite needs to run and to be tested. There was no dependency file at all until 22 Oct, which meant the
# environment could not be rebuilt on another machine - a quiet blocker for the Windows port and for anyone else
# ever touching this. Versions are the ones measured working on the founder's Mac.
[project]
name = "indite"
version = "0.1.0"
description = "Offline Hinglish speech to text for macOS"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",          # the narration tidy-up (mac/polish.py): filters and the noise subtraction
    "sounddevice>=0.5",     # the microphone
    "pynput>=1.8",          # the hotkey
    "rumps>=0.4",           # the menu-bar app
    "pyobjc-core>=11",      # the pill, the card, the window, screen recording
    "pyobjc-framework-Cocoa>=11",
    "av>=14",               # reading audio and video files without torch
    "sherpa-onnx>=1.12",    # who spoke
]

[project.optional-dependencies]
# Only needed to run the tests: uv pip install -e ".[dev]"
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
