[project]
name = "indite"
version = "0.1.0"
description = "Hinglish-first speech-to-text"
requires-python = ">=3.11"
dependencies = [
    "av>=12",       # decodes any audio/video format; bundles ffmpeg, so no system install
    "numpy>=1.26",
    "httpx>=0.27",
    "truststore>=0.9",  # trust the OS certificate store (works behind company HTTPS inspection)
    "silero-vad>=6",  # speech detector for the guards (MIT); pulls in torch
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",  # file uploads
]

[project.optional-dependencies]
# Speaker separation (who spoke when). pyannote community-1 is CC-BY-4.0: credit pyannote.
speakers = ["pyannote.audio>=4"]

[project.scripts]
indite = "indite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
