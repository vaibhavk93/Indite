plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.whispercppdemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.indite.app"
        minSdk 26
        targetSdk 34
        // Bump both for every build installed on a phone (and tag it in git), so you can tell which one is installed.
        versionCode 11
        versionName "0.11"
        buildConfigField "String", "GIT", "\"${'git rev-parse --short HEAD'.execute([], rootDir).text.trim()}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            abiFilters 'arm64-v8a'  // indite: modern phones only (the engine needs arm64 + dotprod)
        }

    }

    // personal: the founder's own build, can ask Claude on his own Mac (needs internet). Removed before launch.
    // public: what users get. No internet permission at all.
    flavorDimensions "dist"
    productFlavors {
        personal { dimension "dist" }
        "public" { dimension "dist" }
    }

    // One signing key for every tester build: if it ever changes, testers must uninstall, which deletes all their notes.
    // The key lives outside the repo (~/.indite/indite-testers.keystore, a backup of this Mac's original key).
    signingConfigs {
        testers {
            storeFile file(System.getProperty("user.home") + "/.indite/indite-testers.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    // When the AGP build type is Debug, the native (NDK/CMake) build does not run
                    // compiler optimizations by default, causing a critical performance issue.
                    // We force CMAKE_BUILD_TYPE to Release here so native code stays optimized
                    // even in Debug AGP builds.
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }

        release {
            signingConfig signingConfigs.testers
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    androidResources {
        noCompress 'bin', 'wav', 'onnx'  // indite: big model loads straight from the APK
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.0'
    }
}

dependencies {
    implementation project(':lib')
    // sherpa-onnx (Apache-2.0) for speaker fingerprints. Not in git (50 MB): download into app/libs/ from
    // https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.compose.material:material-icons-core:1.5.0'
    implementation 'androidx.compose.material3:material3:1.1.1'
    implementation "androidx.compose.ui:ui:1.5.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.5.0"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.5.0"
    debugImplementation "androidx.compose.ui:ui-tooling:1.5.0"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.5.0"
}