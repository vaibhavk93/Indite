plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.whispercpp'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'  // indite: modern phones only, smaller APK
        }
        externalNativeBuild {
            cmake {
                arguments "-DWHISPER_SRC=${rootProject.file('../.tools/whisper.cpp').absolutePath}",  // indite
                        // indite: without this the ggml maths code gets no -march at all (no fp16/dotprod fast paths).
                        // ponytail: one baseline for all phones; i8mm (SD 8 Gen 1+) needs GGML_CPU_ALL_VARIANTS
                        "-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16"

            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    ndkVersion "25.2.9519653"
    externalNativeBuild {
        cmake {
            path = file("src/main/jni/whisper/CMakeLists.txt")
        }
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
}