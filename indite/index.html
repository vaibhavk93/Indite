<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>indite</title>
<style>
:root {
  --bg: #f4f6f7; --surface: #fff; --ink: #15212b; --muted: #5a6873; --line: #d9dfe3;
  --accent: #a95c12; --accent-soft: #fbeedd; --warn: #8a5f00; --warn-soft: #fbf1d6; --bad: #b23a3a; --good: #1f7a5a;
  --peek: #eef2f4; --on-accent: #fff;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #10171d; --surface: #18222a; --ink: #e6ecef; --muted: #9aa8b2; --line: #2c3a44;
  --accent: #f0a050; --accent-soft: #3a2a17; --warn: #e6c25a; --warn-soft: #352c12; --bad: #ef8080; --good: #5cc79c;
  --peek: #121b22; --on-accent: #10171d; color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; display: grid; gap: 20px; }
h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.01em; } h1 span { color: var(--accent); }
h2 { margin: 0; font-size: 1.1rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; }
button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.danger { color: var(--bad); }
button.small { padding: 3px 9px; font-size: .8rem; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type=text] { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--surface); color: var(--ink); max-width: 100%; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.privacy { font-size: .85rem; padding: 6px 10px; border-radius: 6px; background: var(--peek); }

/* moving progress bar: stripes slide while working; full-width stripes when the % isn't known yet */
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 4px; background-color: var(--accent); transition: width .6s ease;
  background-image: linear-gradient(45deg, rgba(255,255,255,.3) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.3) 50%, rgba(255,255,255,.3) 75%, transparent 75%);
  background-size: 16px 16px; }
.bar.unknown > i { width: 100% !important; opacity: .5; }
@media (prefers-reduced-motion: no-preference) { .bar > i { animation: slide .8s linear infinite; } }
@keyframes slide { to { background-position: 16px 0; } }

.job { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.job:first-child { border-top: 0; }
.job .head { display: flex; gap: 10px; align-items: center; cursor: pointer; border-radius: 6px; }
.job .name { font-weight: 600; overflow-wrap: anywhere; }
.pill { font: 600 .7rem/1 var(--mono); padding: 5px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .05em; background: var(--line); color: var(--muted); white-space: nowrap; }
.pill.done { background: var(--accent-soft); color: var(--good); } .pill.error { color: var(--bad); }
.pill.working, .pill.queued { color: var(--accent); }
.err { color: var(--bad); font-size: .9rem; }
.expiring { color: var(--warn); font-weight: 600; }

/* peek: latest transcribed lines, older ones fade upward */
.peek { background: var(--peek); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: .85rem/1.5 var(--mono);
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.35), #000 55%); mask-image: linear-gradient(to bottom, rgba(0,0,0,.35), #000 55%); }
.peek p { margin: 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.peek p:last-child { color: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .peek p.new { animation: rise .35s ease-out; } @keyframes rise { from { opacity: 0; transform: translateY(6px); } } }
.linkish { border: 0; background: none; padding: 0; color: var(--muted); font-size: .8rem; text-decoration: underline; cursor: pointer; }

/* editor: player pinned at top, buttons pinned at bottom while scrolling a long transcript */
#editor { padding-top: 0; padding-bottom: 0; }
.pin-top { position: sticky; top: 0; z-index: 2; background: var(--surface); padding-top: 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.pin-bottom { position: sticky; bottom: 0; z-index: 2; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 0 16px; }
audio { width: 100%; }
.seg { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 6px 4px; border-radius: 6px; scroll-margin: 140px 0 90px; }
.seg.now { background: var(--accent-soft); }
.seg .t { font: .8rem/2 var(--mono); color: var(--muted); border: 0; background: none; padding: 0; text-align: left; }
.seg .t:hover { color: var(--accent); }
.seg .x { outline: none; border-bottom: 1px dashed transparent; min-width: 0; overflow-wrap: anywhere; }
.seg .x:focus { border-bottom-color: var(--accent); }
.seg .x.edited { border-bottom-color: var(--good); }
.seg .x.edited::after { content: " · edited"; color: var(--good); font-size: .75rem; }
.seg .x:focus.edited::after { content: ""; }
.check { grid-column: 2; font-size: .8rem; color: var(--warn); background: var(--warn-soft); padding: 2px 8px; border-radius: 4px; justify-self: start; }
mark { background: var(--warn-soft); color: inherit; outline: 1px solid var(--warn); border-radius: 2px; }
.notice { font-size: .85rem; color: var(--warn); background: var(--warn-soft); padding: 6px 10px; border-radius: 6px; }
.dirty { color: var(--accent); font-size: .85rem; }
kbd { font: .75rem var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
#status { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .9rem; max-width: calc(100% - 32px); z-index: 5; }
#status:empty { display: none; }
@media (prefers-reduced-motion: no-preference) { .seg { transition: background .2s; } }
</style>
</head>
<body>
<main>
  <h1>indite<span>.</span></h1>

  <section class="card" id="upload">
    <h2>New transcript</h2>
    <label class="drop" id="drop" for="file">
      <strong>Drop audio or video here</strong><br>
      <span class="muted">MP3, M4A, WAV, OPUS (WhatsApp), MP4, MPEG · up to 1 GB</span><br>
      <input type="file" id="file" accept="audio/*,video/*,.opus,.amr,.mpeg,.mpg,.mpga">
    </label>
    <div class="row">
      <label for="engine" class="muted">Engine</label>
      <select id="engine"></select>
      <span class="grow"></span>
      <button class="primary" id="go" disabled>Transcribe</button>
    </div>
    <div class="privacy" id="privacy"></div>
    <span class="muted">Transcripts and audio are deleted after 3 years. Export anything you want to keep. Output is in Roman script.</span>
  </section>

  <section class="card">
    <h2>Your transcripts</h2>
    <div id="jobs"><span class="muted" id="empty">No transcripts yet. Upload a file above to start.</span></div>
  </section>

  <section class="card" id="editor" hidden>
    <div class="pin-top">
      <div class="row"><h2 class="grow" id="title" tabindex="-1"></h2><button id="close">Close</button></div>
      <audio id="player" controls preload="metadata"></audio>
      <div class="row">
        <button class="small" id="back5" title="Back 5 seconds (Alt+←)">⟲ 5 s</button>
        <span class="muted num" id="speed">1×</span>
        <span class="grow"></span>
        <input type="text" id="find" placeholder="Find" aria-label="Find" size="12">
        <input type="text" id="repl" placeholder="Replace with" aria-label="Replace with" size="12">
        <button class="small" id="replAll" disabled>Replace all</button>
        <button class="small" id="undo" hidden>Undo</button>
      </div>
      <span class="muted"><kbd>⌘S</kbd> save · <kbd>Esc</kbd> stop editing · <kbd>Alt</kbd>+<kbd>←</kbd>/<kbd>→</kbd> 5 s · <kbd>[</kbd> <kbd>]</kbd> speed · click a time to hear it</span>
    </div>
    <div class="notice" id="damaged" hidden></div>
    <div class="notice row" id="draft" hidden><span class="grow" id="draftText"></span><button class="small" id="restore">Restore</button><button class="small" id="discard">Discard</button></div>
    <div id="segs"></div>
    <div class="pin-bottom row">
      <button class="primary" id="save" disabled>Save changes</button>
      <span class="dirty" id="dirty" hidden>● Unsaved</span>
      <select id="style" aria-label="Export format">
        <option value="timestamped">Timestamped .txt (interviews, calls)</option>
        <option value="paragraphs">Paragraphs .txt (lectures, notes)</option>
        <option value="srt">Subtitles .srt</option>
        <option value="vtt">Subtitles .vtt</option>
      </select>
      <button id="export">Export</button>
      <button id="copy" title="Copies the transcript text. It goes to whichever AI service you paste it into.">Copy for Claude / ChatGPT</button>
      <span class="grow"></span>
      <button class="danger" id="del">Delete</button>
    </div>
  </section>
</main>
<div id="status" role="status" aria-live="polite"></div>
<script>
const $ = s => document.querySelector(s);
const STAGE = { reading: "Reading audio", finding: "Finding speech", transcribing: "Transcribing", retrying: "Re-doing a few unclear bits", checking: "Checking for invented text" };
const NOTE = { no_speech: "no speech heard here", repeated: "repeating text", stock_phrase: "possibly invented", junk_word: "junk text (nan)" };
const PRIVACY = { local: "🔒 Local engine: your audio stays on this Mac.", "local-best": "🔒 Local engine: your audio stays on this Mac.", sarvam: "☁️ Sarvam: your audio is sent to Sarvam's servers to be transcribed." };
const KEEP_DAYS = 3 * 365, SPEEDS = [0.75, 1, 1.25, 1.5, 2];
let current = null, dirty = false, poll = null, hidePeek = new Set(), lastStatus = {}, doneUnseen = false, undoTexts = null;

let statusTimer;
function say(msg, error = false) {  // one status area that screen readers announce
  const s = $("#status"); s.textContent = msg; clearTimeout(statusTimer);
  statusTimer = setTimeout(() => s.textContent = "", error ? 6000 : 3000);
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `Request failed (${r.status})`);
  return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
}
const clock = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const span = s => s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min` : s >= 60 ? `${Math.round(s / 60)} min` : `${Math.max(1, Math.round(s))} s`;
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ---------- engines + privacy notice ----------
async function loadEngines() {
  const ready = await api("/engines");
  const labels = { local: "Local · free · ~12 min per hour of audio", "local-best": "Local · best quality · free · slower (~21 min per hour)", sarvam: "Sarvam · paid · ~₹30/hour · fastest" };
  $("#engine").replaceChildren(...Object.keys(labels).map(k => {
    const o = el("option", null, ready[k] ? `${labels[k]} (${ready[k]})` : labels[k]); o.value = k; o.disabled = !!ready[k]; return o;
  }));
  $("#engine").value = ["local", "local-best", "sarvam"].find(k => !ready[k]) || "local";
  $("#engine").onchange();
}
$("#engine").onchange = () => { $("#privacy").textContent = PRIVACY[$("#engine").value] || ""; };

// ---------- upload ----------
const file = $("#file"), drop = $("#drop");
file.onchange = () => { $("#go").disabled = !file.files.length; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); file.files = e.dataTransfer.files; file.onchange(); };
$("#go").onclick = async () => {
  const fd = new FormData(); fd.append("file", file.files[0]); fd.append("engine", $("#engine").value);
  $("#go").disabled = true; $("#go").textContent = "Uploading…";
  try { await api("/jobs", { method: "POST", body: fd }); file.value = ""; say("Uploaded. Transcribing now."); }
  catch (e) { say(e.message, true); }
  $("#go").textContent = "Transcribe"; file.onchange(); loadJobs();
};

// ---------- list: rows are built once and updated in place, so bars animate smoothly and focus stays ----------
const rows = new Map();
function makeRow(id) {
  const r = { job: null, box: el("div", "job") };
  r.head = el("div", "head"); r.head.tabIndex = 0; r.head.setAttribute("role", "button");
  r.name = el("span", "name grow"); r.pill = el("span", "pill"); r.head.append(r.name, r.pill);
  r.meta = el("div", "row"); r.info = el("span", "muted num grow"); r.action = el("button", "small danger"); r.meta.append(r.info, r.action);
  r.prog = el("div"); r.bar = el("div", "bar"); r.fill = el("i"); r.bar.append(r.fill);
  r.stage = el("div", "row"); r.stageText = el("span", "muted num grow"); r.peekBtn = el("button", "linkish");
  r.stage.append(r.stageText, r.peekBtn); r.prog.append(r.bar, r.stage);
  r.peek = el("div", "peek"); r.err = el("div", "err");
  r.box.append(r.head, r.meta, r.prog, r.peek, r.err);
  const open = () => {
    const j = r.job;
    if (j.status === "done") openJob(j.id);
    else if (j.status === "error") say(j.error, true);
    else say("Still working on it. Watch the live view below.");
  };
  r.head.onclick = open;
  r.head.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
  r.peekBtn.onclick = () => { hidePeek.has(id) ? hidePeek.delete(id) : hidePeek.add(id); paint(r); };
  let armed = false;
  r.action.onclick = async () => {
    const busy = r.job.status === "queued" || r.job.status === "working";
    if (!armed) { armed = true; r.action.textContent = "Click again to confirm"; setTimeout(() => { armed = false; r.action.textContent = ""; paint(r); }, 4000); return; }
    armed = false; r.action.disabled = true; r.action.textContent = busy ? "Cancelling…" : "Deleting…";
    try { await api(`/jobs/${id}`, { method: "DELETE" }); say(busy ? "Cancelled and deleted" : "Deleted"); }
    catch (e) { say(e.message, true); }
    if (current?.id === id) closeEditor(true);
    loadJobs();
  };
  rows.set(id, r); return r;
}
function paint(r) {
  const j = r.job, busy = j.status === "queued" || j.status === "working";
  r.name.textContent = j.name;
  r.pill.className = `pill ${j.status}`; r.pill.textContent = j.status;
  const bits = [];
  if (j.audio_seconds) bits.push(span(j.audio_seconds));
  bits.push({ local: "Local", "local-best": "Local · best", sarvam: "Sarvam" }[j.engine] || j.engine);
  if (j.took) bits.push(`done in ${span(j.took)}`);
  if (j.damaged_packets) bits.push(`⚠ ${j.damaged_packets} damaged spot${j.damaged_packets > 1 ? "s" : ""} skipped`);
  const daysLeft = Math.ceil(KEEP_DAYS - (Date.now() / 1000 - j.created) / 86400);
  r.info.textContent = bits.join(" · ") + " · ";
  const exp = el("span", daysLeft <= 3 ? "expiring" : "", daysLeft <= 1 ? "deleted within a day" : daysLeft > 60 ? `kept until ${new Date((j.created + KEEP_DAYS * 86400) * 1000).toLocaleDateString([], { dateStyle: "medium" })}` : `deleted in ${daysLeft} days`);
  r.info.append(exp);
  if (!r.action.disabled && !r.action.textContent.startsWith("Click")) r.action.textContent = busy ? "Cancel & delete" : "Delete";
  r.action.hidden = j.status === "done";  // done jobs are deleted from the editor
  r.prog.hidden = !busy;
  if (busy) {
    const p = j.progress || 0, known = j.status === "working" && j.stage === "transcribing" && p > 0;
    r.bar.classList.toggle("unknown", !known);
    r.fill.style.width = `${Math.max(p * 100, 2)}%`;
    let text = j.status === "queued" ? "Waiting for the file ahead of it" : STAGE[j.stage] || "Starting";
    if (known) {
      text += ` · ${Math.round(p * 100)}%`;
      if (p > 0.03 && j.started) text += ` · about ${span((Date.now() / 1000 - j.started) / p * (1 - p))} left`;
    }
    r.stageText.textContent = text;
  }
  const lines = (j.preview || []).slice(-3);
  r.peekBtn.hidden = !busy || !lines.length;
  r.peekBtn.textContent = hidePeek.has(j.id) ? "Show live text" : "Hide live text";
  r.peek.hidden = !busy || !lines.length || hidePeek.has(j.id);
  const shown = [...r.peek.children].map(p => p.textContent);
  if (lines.join("\n") !== shown.join("\n")) r.peek.replaceChildren(...lines.map(t => el("p", shown.includes(t) ? "" : "new", t)));
  r.err.hidden = j.status !== "error"; r.err.textContent = j.error || "";
}
async function loadJobs() {
  clearTimeout(poll);
  let jobs;
  try { jobs = await api("/jobs"); }
  catch { poll = setTimeout(loadJobs, 3000); return; }  // keep trying if one refresh fails
  $("#empty").hidden = jobs.length > 0;
  const box = $("#jobs"), keep = new Set(jobs.map(j => j.id));
  for (const [id, r] of rows) if (!keep.has(id)) { r.box.remove(); rows.delete(id); }
  jobs.forEach((j, i) => {
    const r = rows.get(j.id) || makeRow(j.id);
    r.job = j; paint(r);
    const at = box.children[i + 1];  // +1 skips the empty-state line
    if (at !== r.box) box.insertBefore(r.box, at || null);
    if (lastStatus[j.id] && lastStatus[j.id] !== "done" && j.status === "done") { doneUnseen = document.hidden; say(`${j.name} is ready`); }
    lastStatus[j.id] = j.status;
  });
  const working = jobs.find(j => j.status === "working");
  document.title = working ? `${Math.round((working.progress || 0) * 100)}% · indite` : doneUnseen ? "✓ Done · indite" : "indite";
  if (jobs.some(j => j.status === "queued" || j.status === "working")) poll = setTimeout(loadJobs, 1500);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && doneUnseen) { doneUnseen = false; document.title = "indite"; } });

// ---------- editor ----------
const segEls = () => [...document.querySelectorAll(".seg .x")];
const draftKey = id => `indite-draft-${id}`;
function setDirty(v) {
  dirty = v; $("#save").disabled = !v; $("#dirty").hidden = !v;
  try { v ? localStorage.setItem(draftKey(current.id), JSON.stringify({ at: Date.now(), texts: segEls().map(x => x.textContent) }))
          : current && localStorage.removeItem(draftKey(current.id)); } catch {}  // browser copy of unsaved edits
}
function markEdited(x, i) { x.classList.toggle("edited", x.textContent.trim() !== (current.result.segments[i].original ?? current.result.segments[i].text).trim()); }
async function openJob(id) {
  if (dirty && current && !confirmLeave()) return;
  current = await api(`/jobs/${id}`); dirty = false; $("#save").disabled = true; $("#dirty").hidden = true;
  undoTexts = null; $("#undo").hidden = true;
  $("#title").textContent = current.name;
  const dmg = current.result.damaged_packets || 0;
  $("#damaged").hidden = !dmg;
  $("#damaged").textContent = `${dmg} damaged spot${dmg > 1 ? "s" : ""} in the file couldn't be read and ${dmg > 1 ? "were" : "was"} skipped. There may be a short gap in the text there.`;
  $("#player").src = `/jobs/${id}/audio`;
  $("#segs").replaceChildren(...current.result.segments.map((s, i) => {
    const row = el("div", "seg"); row.dataset.start = s.start; row.dataset.end = s.end;
    const t = el("button", "t", clock(s.start)); t.setAttribute("aria-label", `Play from ${clock(s.start)}`);
    t.onclick = () => { $("#player").currentTime = s.start; $("#player").play(); };
    const x = el("div", "x", s.text.trim()); x.contentEditable = "plaintext-only";
    markEdited(x, i);
    x.oninput = () => { markEdited(x, i); setDirty(true); };
    x.onkeydown = e => { if (e.key === "Enter") e.preventDefault(); };  // one line per block
    row.append(t, x);
    if (s.flags) row.append(el("span", "check", "Check: " + s.flags.map(f => NOTE[f] || f).join(", ")));
    return row;
  }));
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(draftKey(id))); } catch {}
  $("#draft").hidden = !(draft && draft.texts.length === current.result.segments.length);
  if (!$("#draft").hidden) $("#draftText").textContent = `Unsaved edits from ${new Date(draft.at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })} were found.`;
  $("#restore").onclick = () => { segEls().forEach((x, i) => { x.textContent = draft.texts[i]; markEdited(x, i); }); $("#draft").hidden = true; setDirty(true); say("Edits restored. Save to keep them."); };
  $("#discard").onclick = () => { try { localStorage.removeItem(draftKey(id)); } catch {} $("#draft").hidden = true; };
  $("#editor").hidden = false; $("#title").focus(); $("#editor").scrollIntoView({ behavior: "smooth" });
  highlightFind();
}
let leaveArmed = false;
function confirmLeave() {  // two-step confirm built into the page
  if (leaveArmed) { leaveArmed = false; return true; }
  leaveArmed = true; say("Unsaved changes. Click again to discard them.", true); setTimeout(() => leaveArmed = false, 4000); return false;
}
function closeEditor(force) {
  if (!current) return;
  if (!force && dirty && !confirmLeave()) return;
  if (force || dirty) try { localStorage.removeItem(draftKey(current.id)); } catch {}
  $("#editor").hidden = true; $("#player").pause(); current = null; dirty = false;
}
$("#close").onclick = () => closeEditor(false);

// follow the playing block: highlight it; keep it in view unless the user is typing
let nowIdx = -1;
$("#player").ontimeupdate = () => {
  const t = $("#player").currentTime, list = document.querySelectorAll(".seg");
  const i = [...list].findIndex(r => t >= +r.dataset.start && t < +r.dataset.end);
  if (i === nowIdx) return;
  list[nowIdx]?.classList.remove("now"); list[i]?.classList.add("now"); nowIdx = i;
  if (i >= 0 && !document.activeElement?.classList.contains("x")) list[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
};
const seek = d => { $("#player").currentTime = Math.max(0, $("#player").currentTime + d); };
const setSpeed = d => {
  const p = $("#player"), i = Math.min(SPEEDS.length - 1, Math.max(0, SPEEDS.indexOf(p.playbackRate) + d));
  p.playbackRate = SPEEDS[i] ?? 1; $("#speed").textContent = `${p.playbackRate}×`;
};
$("#player").onratechange = () => { $("#speed").textContent = `${$("#player").playbackRate}×`; };
$("#back5").onclick = () => seek(-5);

async function save() {
  try { await api(`/jobs/${current.id}/segments`, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ texts: segEls().map(x => x.textContent) }) });
        current = await api(`/jobs/${current.id}`); setDirty(false); say("Saved"); }
  catch (e) { say(e.message, true); }
}
$("#save").onclick = save;
document.addEventListener("keydown", e => {
  if ($("#editor").hidden) return;
  const typing = ["x"].some(c => document.activeElement?.classList.contains(c)) || document.activeElement?.tagName === "INPUT";
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (dirty) save(); }
  else if (e.key === "Escape" && typing) document.activeElement.blur();
  else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); seek(-5); }
  else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); seek(5); }
  else if (!typing && e.key === "[") setSpeed(-1);
  else if (!typing && e.key === "]") setSpeed(1);
});

// ---------- find & replace (whole words, any case), with a count and one-step undo ----------
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const pattern = () => $("#find").value.trim() ? new RegExp(`(?<![\\p{L}\\p{N}])${esc($("#find").value.trim())}(?![\\p{L}\\p{N}])`, "giu") : null;
function highlightFind() {
  const re = pattern(); let n = 0;
  segEls().forEach(x => { if (re) n += (x.textContent.match(re) || []).length; });
  $("#replAll").disabled = !n;
  $("#replAll").textContent = re ? (n ? `Replace all (${n})` : "No matches") : "Replace all";
}
$("#find").oninput = highlightFind;
$("#replAll").onclick = () => {
  const re = pattern(); if (!re) return;
  undoTexts = segEls().map(x => x.textContent); let n = 0;
  segEls().forEach((x, i) => { const t = x.textContent.replace(re, () => (n++, $("#repl").value)); if (t !== x.textContent) { x.textContent = t; markEdited(x, i); } });
  $("#undo").hidden = false; setDirty(true); highlightFind();
  say(`Replaced ${n} match${n === 1 ? "" : "es"}. Save to keep, or Undo.`);
};
$("#undo").onclick = () => {
  if (!undoTexts) return;
  segEls().forEach((x, i) => { x.textContent = undoTexts[i]; markEdited(x, i); });
  undoTexts = null; $("#undo").hidden = true; setDirty(true); highlightFind(); say("Replace undone");
};

$("#export").onclick = async () => {
  if (dirty) await save();
  if (!dirty) location.href = `/jobs/${current.id}/export/${$("#style").value}`;
};
$("#copy").onclick = async () => {
  if (dirty) await save();
  const text = await api(`/jobs/${current.id}/export/timestamped`);
  const prompt = "Below is a transcript of a recording in Hinglish (Hindi + English, Roman script). " +
    "Write: 1) a short summary, 2) decisions made, 3) action items with owner and deadline if mentioned, 4) open questions. " +
    "Use only what is in the transcript. If something is not mentioned, say so. Lines marked [check: ...] may be wrong.\n\n";
  try { await navigator.clipboard.writeText(prompt + text); say("Copied. Paste it into Claude or ChatGPT."); }
  catch { say("Copy was blocked by the browser. Use Export instead.", true); }
};
let delArmed = false;
$("#del").onclick = async () => {
  if (dirty) return say("Save or discard your changes before deleting.", true);
  if (!delArmed) { delArmed = true; $("#del").textContent = "Click again to delete"; setTimeout(() => { delArmed = false; $("#del").textContent = "Delete"; }, 4000); return; }
  await api(`/jobs/${current.id}`, { method: "DELETE" });
  delArmed = false; $("#del").textContent = "Delete"; closeEditor(true); say("Deleted"); loadJobs();
};
window.onbeforeunload = e => { if (dirty) e.preventDefault(); };
loadEngines().catch(e => say(e.message, true));
loadJobs();
</script>
