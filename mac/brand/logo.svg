<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- indite: five voice bars; the middle one is the letter i (stem + dot). Speech becoming writing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F28A2E"/>
      <stop offset="1" stop-color="#D9640F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824 x 824 body centred in 1024, continuous-corner radius ~185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <g fill="#fff">
    <rect x="262" y="452" width="64" height="200" rx="32" opacity=".72"/>
    <rect x="370" y="392" width="64" height="320" rx="32" opacity=".86"/>
    <rect x="480" y="440" width="64" height="372" rx="32"/>
    <circle cx="512" cy="340" r="46"/>
    <rect x="590" y="392" width="64" height="320" rx="32" opacity=".86"/>
    <rect x="698" y="452" width="64" height="200" rx="32" opacity=".72"/>
  </g>
</svg>
